services:
  - type: web
    name: gemini-chatbot-backend
    env: node
    plan: free
    rootDir: backend

    buildCommand: npm install
    startCommand: npm start

    envVars:
      - key: GEMINI_API_KEY
        sync: false

      - key: CORS_ORIGIN
        value: https://gemini-chatbot-frontend.onrender.com

  - type: web
    name: gemini-chatbot-frontend
    env: static
    plan: free
    rootDir: frontend

    buildCommand: npm install && npm run build
    staticPublishPath: dist

    envVars:
      - key: VITE_API_URL
        value: https://gemini-chatbot-backend.onrender.com/api
